  <link rel="manifest" href='data:application/manifest+json,{"name":"F%C3%AAnix%20Consulta%20Empresarial","short_name":"F%C3%AAnix%20CNPJ","start_url":".","display":"standalone","background_color":"%23041273","theme_color":"%23041273","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3163/3163478.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:      #041273;
      --brand-mid:  #071EA8;
      --brand-lite: #0B2ED4;
      --brand-glow: rgba(4,18,115,0.6);

      --surface:  rgba(5,20,90,0.75);
      --surface2: rgba(4,15,75,0.85);
      --surface3: rgba(7,22,100,0.5);

      --border:   rgba(100,140,255,0.13);
      --border2:  rgba(100,140,255,0.07);
      --border-hi: rgba(100,140,255,0.22);

      --gold:      #F59E0B;
      --gold-hi:   #FCD34D;
      --gold-dim:  rgba(245,158,11,0.14);
      --emerald:   #10B981;
      --red:       #EF4444;

      --text:   #D8E4FF;

      /* Fontes Segoe UI com fallbacks */
      --font-label: 'Segoe UI', 'Segoe UI Emoji', Tahoma, Geneva, Verdana, sans-serif;
      --font-input: 'Segoe UI', 'Segoe UI Emoji', Tahoma, Geneva, Verdana, sans-serif;

    html { scroll-behavior: smooth; }

    body {

          #021050 100%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10%  0%,  rgba(59,130,246,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(16,185,129,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 50%  50%, rgba(245,158,11,0.05) 0%, transparent 70%);

    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(100,140,255,0.03) 1px, transparent 1px),

    #root { position: relative; z-index: 1; }

    /* ── Tipografia ── */
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Label: Segoe UI Bold+Italic */

      font-family: var(--font-label);

      font-weight: 700;
      font-style: italic;

    .label::after {

      font-weight: 700;

    .data-card-val { font-size: 0.9rem; color: var(--text); font-weight: 500; word-break: break-word; line-height: 1.45; }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);

      pointer-events: none; z-index: 999; opacity: 0;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Erro */
    .error-box {
      margin-top: 12px;
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.22);
      border-radius: 10px; padding: 12px 16px;
      font-size: 0.85rem; color: #FCA5A5;
      display: flex; align-items: center; gap: 8px;
    }

    /* Histórico */
    .hist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(3,10,60,0.5);

      transition: border-color 0.15s, background 0.15s;

    .hist-item:hover {
      border-color: rgba(245,158,11,0.25);

    /* Sócios */
    .socio-card {
      background: rgba(3,10,60,0.55);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(3,11,58,0.3);
      border-top-color: #020B3A;
      animation: spin 0.7s linear infinite;
      display: inline-block; flex-shrink: 0;

    /* Animações */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }

    @keyframes glow {

    /* CNAE */
    .cnae-row {
      display: flex; gap: 14px; align-items: flex-start;

    .cnae-row + .cnae-row { border-top: 1px solid var(--border2); }
    .cnae-code {

    /* Footer */
    footer { text-align: center; padding: 22px 0 10px; font-size: 0.72rem; color: var(--muted2); }

    /* Tag de encerramento */
    .encerrada-badge {

      letter-spacing: 0.07em; text-transform: uppercase;

    /* Chip de info no hist */
    .hist-chip {
      font-size: 0.6rem;
      color: var(--muted2);

      white-space: nowrap;

    /* Responsive */
    @media (max-width: 580px) {
      .data-grid { grid-template-columns: 1fr 1fr; }
      .search-row { flex-direction: column; }

    /* PDF print helper – não afeta tela */
    @media print {
      body { background: white !important; color: black !important; }
    }

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Utilitários ─────────────────────────────────────────────────────────────

const maskCnpj = (v = '') => {
  const d = v.replace(/\D/g, '').slice(0, 14);
  return d
    .replace(/^(\d{2})(\d)/,          '$1.$2')
    .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/\.(\d{3})(\d)/,         '.$1/$2')
    .replace(/(\d{4})(\d)/,           '$1-$2');
};

const fmtCurrency = (v) =>
  Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

/**
 * Formata valor em BRL com valor por extenso.
 * Ex: R$ 50.000,00 (Cinquenta mil reais)
 */
const unidades = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove',
  'dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const dezenas  = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const centenas = ['','cento','duzentos','trezentos','quatrocentos','quinhentos',
  'seiscentos','setecentos','oitocentos','novecentos'];

const numParaExtenso = (n) => {
  n = Math.floor(n);
  if (n === 0) return 'zero';
  if (n === 100) return 'cem';
  if (n < 0) return 'menos ' + numParaExtenso(-n);
  let s = '';
  const bi  = Math.floor(n / 1_000_000_000);
  const mi  = Math.floor((n % 1_000_000_000) / 1_000_000);
  const mil = Math.floor((n % 1_000_000) / 1000);
  const res = n % 1000;

  if (bi)  s += (bi  === 1 ? 'um bilhão' : numParaExtenso(bi)  + ' bilhões') + (n % 1_000_000_000 ? ' e ' : '');
  if (mi)  s += (mi  === 1 ? 'um milhão' : numParaExtenso(mi)  + ' milhões') + (n % 1_000_000 ? ' e ' : '');
  if (mil) s += (mil === 1 ? 'mil'        : numParaExtenso(mil) + ' mil')     + (res ? ' e ' : '');
  if (res) {
    const c = Math.floor(res / 100);
    const d = Math.floor((res % 100) / 10);
    const u = res % 10;
    const dois_dig = (res % 100);
    if (c) s += centenas[c] + (res % 100 ? ' e ' : '');
    if (dois_dig < 20 && dois_dig > 0) s += unidades[dois_dig];
    else {
      if (d) s += dezenas[d] + (u ? ' e ' : '');
      if (u) s += unidades[u];
    }
  }
  return s.trim();
};

const fmtCurrencyExtended = (v) => {
  const num = Number(v);
  if (isNaN(num) || num === 0) return fmtCurrency(v);
  const cents = Math.round((num % 1) * 100);
  const reais = Math.floor(num);
  const rExt  = numParaExtenso(reais);
  const cExt  = cents > 0 ? numParaExtenso(cents) : null;
  // Capitaliza primeira letra
  const cap   = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  let extenso = cap(rExt) + (reais === 1 ? ' real' : ' reais');
  if (cExt) extenso += ' e ' + cExt + (cents === 1 ? ' centavo' : ' centavos');
  return fmtCurrency(v) + '  |  ' + extenso;
};

const fmtCep = (v) =>
  String(v).padStart(8, '0').replace(/^(\d{5})(\d{3})$/, '$1-$2');

const fmtDate = (v) => {
  if (!v) return '—';
  const d = new Date(String(v).includes('T') ? v : v + 'T12:00:00');
  return isNaN(d.getTime()) ? String(v) : d.toLocaleDateString('pt-BR');
};

const statusCls = (s = '') => {
  const u = s.toUpperCase();
  if (u.includes('ATIVA') && !u.includes('INAPT') && !u.includes('INATIVA')) return 'ativa';
  if (['INATIVA','BAIXADA','CANCELADA','NULA','INAPTA'].some(w => u.includes(w))) return 'inativa';
  return 'outro';
};

const isEncerrada = (s = '') => {
  const u = s.toUpperCase();
  return ['BAIXADA','CANCELADA','NULA','INATIVA','INAPTA'].some(w => u.includes(w));
};

/**
 * Formata telefone no padrão ABNT NBR 14237:
 *   (XX) XXXX-XXXX  — fixo
 *   (XX) 9XXXX-XXXX — celular
 * Aceita string "DDNÚMERO" sem pontuação ou já formatado.
 */
const fmtTelefone = (raw) => {
  if (!raw) return null;
  const digits = String(raw).replace(/\D/g, '');
  if (digits.length === 0) return null;
  if (digits.length === 10) {
    // fixo: (DD) XXXX-XXXX
    return `(${digits.slice(0,2)}) ${digits.slice(2,6)}-${digits.slice(6)}`;
  }
  if (digits.length === 11) {
    // celular: (DD) 9XXXX-XXXX
    return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
  }
  // retorna como está se não bater
  return raw;
};

/**
 * Retorna lista de telefones únicos e formatados (ABNT).
 * Elimina duplicatas comparando só dígitos.
 */
const getTelefones = (data) => {
  const raw = [data.ddd_telefone_1, data.ddd_telefone_2].filter(Boolean);
  const seen = new Set();
  return raw.reduce((acc, t) => {
    const digits = String(t).replace(/\D/g, '');
    if (digits && !seen.has(digits)) {
      seen.add(digits);
      acc.push(fmtTelefone(t));
    }
    return acc;
  }, []);
};

const downloadJson = (obj, filename) => {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click(); URL.revokeObjectURL(url);
};

// ─── Importar backup JSON ─────────────────────────────────────────────────────

const importJsonBackup = (file) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        // aceita array direto ou objeto { history: [...] }
        if (Array.isArray(parsed)) {
          resolve(parsed);
        } else if (parsed && Array.isArray(parsed.history)) {
          resolve(parsed.history);
        } else {
          reject(new Error('Formato inválido. Esperado array de registros.'));
        }
      } catch {
        reject(new Error('Arquivo JSON inválido.'));
      }
    };
    reader.onerror = () => reject(new Error('Erro ao ler o arquivo.'));
    reader.readAsText(file);
  });
};

// ─── Exportar PDF ─────────────────────────────────────────────────────────────

const exportPdf = (data, meta) => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  const W = doc.internal.pageSize.getWidth();
  const margin = 16;
  let y = 20;

  const line = (txt, size = 10, bold = false, color = [20,30,100]) => {
    doc.setFontSize(size);
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setTextColor(...color);
    const lines = doc.splitTextToSize(txt, W - margin * 2);
    doc.text(lines, margin, y);
    y += 6 * lines.length;
  };

  const rule = (r=220,g=220,b=230) => {
    doc.setDrawColor(r,g,b); doc.setLineWidth(0.3);
    doc.line(margin, y, W - margin, y); y += 5;
  };

  const field = (lbl, val) => {
    if (!val || val === '—') return;
    doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.setTextColor(120,130,180);
    doc.text(lbl.toUpperCase(), margin, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(30,30,60);
    const lines = doc.splitTextToSize(String(val), W - margin * 2 - 36);
    doc.text(lines, margin + 38, y);
    y += 6 * Math.max(lines.length, 1);
  };

  // Cabeçalho
  doc.setFillColor(4, 18, 115);
  doc.rect(0, 0, W, 28, 'F');
  doc.setFontSize(18); doc.setFont('helvetica','bold');
  doc.setTextColor(245,158,11);
  doc.text('FÊNIX', margin, 14);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.setTextColor(180,205,255);
  doc.text('Sistema de Consulta Empresarial · BrasilAPI', margin, 21);
  if (meta) {
    doc.setFontSize(8); doc.setTextColor(150,170,220);
    doc.text(
      `Consultado em ${meta.time.toLocaleString('pt-BR')} · ${meta.ms} ms`,
      W - margin, 21, { align: 'right' }
    );
  }
  y = 36;

  // Nome
  line(data.razao_social || '—', 15, true, [20,30,100]);
  if (data.nome_fantasia) line(data.nome_fantasia, 10, false, [80,100,160]);
  y += 2; rule();

  // Identificação
  line('IDENTIFICAÇÃO', 9, true, [4,18,115]);
  field('CNPJ',              maskCnpj(data.cnpj || ''));
  field('Natureza Jurídica', data.natureza_juridica);
  field('Porte',             data.porte);
  field('Situação',         data.descricao_situacao_cadastral);
  if (data.descricao_motivo_situacao_cadastral)
    field('Motivo',          data.descricao_motivo_situacao_cadastral);
  field('Abertura',          fmtDate(data.data_inicio_atividade));
  if (isEncerrada(data.descricao_situacao_cadastral || '') && data.data_situacao_cadastral)
    field('Encerramento',    fmtDate(data.data_situacao_cadastral));
  field('Capital Social',    data.capital_social ? fmtCurrency(data.capital_social) : null);
  field('Simples Nacional',  data.opcao_pelo_simples != null ? (data.opcao_pelo_simples ? 'Sim' : 'Não') : null);
  field('MEI',               data.opcao_pelo_mei    != null ? (data.opcao_pelo_mei    ? 'Sim' : 'Não') : null);
  y += 2; rule();

  // Endereço
  line('ENDEREÇO', 9, true, [4,18,115]);
  field('Logradouro', [data.tipo_logradouro, data.logradouro, data.numero, data.complemento].filter(Boolean).join(' '));
  field('Bairro',    data.bairro);
  field('Município', data.municipio);
  field('UF',        data.uf);
  field('CEP',       data.cep ? fmtCep(String(data.cep)) : null);
  y += 2; rule();

  // Contato
  const fones = getTelefones(data);
  if (fones.length || data.email) {
    line('CONTATO', 9, true, [4,18,115]);
    fones.forEach((t, i) => field(i === 0 ? 'Telefone' : `Telefone ${i+1}`, t));
    field('E-mail', data.email);
    y += 2; rule();
  }

  // CNAE
  if (data.cnae_fiscal || (data.cnaes_secundarios && data.cnaes_secundarios.length)) {
    line('ATIVIDADES ECONÔMICAS', 9, true, [4,18,115]);
    if (data.cnae_fiscal) field('CNAE Principal', `${data.cnae_fiscal} — ${data.cnae_fiscal_descricao || ''}`);
    if (data.cnaes_secundarios && data.cnaes_secundarios.length) {
      data.cnaes_secundarios.forEach(c => field(`CNAE ${c.codigo}`, c.descricao));
    }
    y += 2; rule();
  }

  // Sócios
  if (data.qsa && data.qsa.length) {
    line('QUADRO SOCIETÁRIO', 9, true, [4,18,115]);
    data.qsa.forEach((s, i) => {
      field(`Sócio ${i+1}`, s.nome_socio || s.nome_representante_legal || '—');
      if (s.qualificacao_socio) field('Qualificação', s.qualificacao_socio);
      if (s.cnpj_cpf_do_socio)  field('CPF/CNPJ',    s.cnpj_cpf_do_socio);
      if (s.data_entrada_sociedade) field('Desde', fmtDate(s.data_entrada_sociedade));
      y += 2;
    });
    rule();
  }

  // Rodapé
  const pageCount = doc.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(160,170,200);
    doc.text(`Fênix Soluções Tecnológicas · fenixsolucoestecnologicas · Página ${p}/${pageCount}`,
      W / 2, doc.internal.pageSize.getHeight() - 8, { align: 'center' });
  }

  const cnpjClean = (data.cnpj || '').replace(/\D/g, '');
  doc.save(`fenix-cnpj-${cnpjClean}.pdf`);
};

// ─── Persistência JSON ────────────────────────────────────────────────────────

const STORAGE_KEY = 'fenix:history:v2';
const loadHistory = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
};
const saveHistory = (list) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
};

const DataCard = ({ label, value, mono }) => (
  <div className="data-card">
    <div className="data-card-lbl">{label}</div>
    <div className={`data-card-val${mono ? ' mono' : ''}`}>{value || '—'}</div>
  </div>
);

const Badge = ({ text }) => (
  <span className={`badge ${statusCls(text || '')}`}>
    <span className="badge-dot"></span>
    {text || 'Desconhecido'}
  </span>
);

// ─── Aplicação principal ──────────────────────────────────────────────────────

function FenixApp() {
  const [cnpj,    setCnpj]    = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');
  const [data,    setData]    = useState(null);
  const [tab,     setTab]     = useState('resumo');
  const [history, setHistory] = useState(loadHistory);
  const [prompt,  setPrompt]  = useState(null);
  const [toast,   setToast]   = useState('');
  const [meta,    setMeta]    = useState(null);
  const inputRef    = useRef(null);
  const toastTimer  = useRef(null);
  const importRef   = useRef(null);   // input file oculto para importar JSON

  // PWA + Service Worker
  useEffect(() => {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); setPrompt(e);
    });
    if ('serviceWorker' in navigator) {
      const sw = `
        const CACHE='fenix-sw-v2';
        self.addEventListener('install',()=>self.skipWaiting());
        self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
        self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('',{status:503}))));
      `;
      const blob = new Blob([sw], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2400);
  };

  const handleInstall = async () => {
    if (!prompt) return;
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === 'accepted') setPrompt(null);
  };

  // Validação visual
  const digits    = cnpj.replace(/\D/g, '');
  const inputCls  = digits.length === 0 ? '' : digits.length === 14 ? ' valid' : ' invalid';

  // ── Consulta ──────────────────────────────────────────────────────────────
  const consultar = useCallback(async () => {
    const clean = cnpj.replace(/\D/g, '');
    if (clean.length !== 14) {
      setError('CNPJ inválido — informe todos os 14 dígitos.');
      return;
    }
    try {
      setLoading(true); setError(''); setData(null);
      const t0  = performance.now();
      const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || `Empresa não encontrada (${res.status})`);
      }
      const result  = await res.json();
      const elapsed = Math.round(performance.now() - t0);
      setData(result);
      setTab('resumo');
      setMeta({ time: new Date(), ms: elapsed });

      // Registro para histórico — inclui abertura, encerramento e capital
      const entry = {
        cnpj:              maskCnpj(clean),
        razao_social:      result.razao_social                     || '',
        nome_fantasia:     result.nome_fantasia                    || '',
        situacao:          result.descricao_situacao_cadastral     || '',
        data_abertura:     result.data_inicio_atividade            || null,
        data_encerramento: isEncerrada(result.descricao_situacao_cadastral || '')
                             ? (result.data_situacao_cadastral || null)
                             : null,
        capital_social:    result.capital_social                   || null,
        cnae_principal:    result.cnae_fiscal_descricao            || '',
        municipio:         result.municipio                        || '',
        uf:                result.uf                               || '',
        consultadoEm:      new Date().toISOString(),
      };
      setHistory(prev => {
        const next = [entry, ...prev.filter(h => h.cnpj !== entry.cnpj)].slice(0, 30);
        saveHistory(next); return next;
      });
    } catch (e) {
      setError(e.message || 'Erro na consulta. Verifique o CNPJ e tente novamente.');
    } finally {
      setLoading(false);
    }
  }, [cnpj]);

  const handleKey   = (e) => { if (e.key === 'Enter') consultar(); };
  const limparBusca = () => { setData(null); setError(''); setCnpj(''); inputRef.current?.focus(); };
  const copyJson    = () => {
    if (!data) return;
    navigator.clipboard.writeText(JSON.stringify(data, null, 2))
      .then(() => showToast('✓ JSON copiado para a área de transferência'));
  };
  const clearHistory = () => { setHistory([]); saveHistory([]); };

  // ── Importar backup JSON ───────────────────────────────────────────────────
  const handleImport = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const imported = await importJsonBackup(file);
      setHistory(prev => {
        // mescla: mantém registros existentes, adiciona novos sem duplicar por CNPJ
        const merged = [...imported, ...prev]
          .filter((v, i, arr) => arr.findIndex(x => x.cnpj === v.cnpj) === i)
          .slice(0, 30);
        saveHistory(merged);
        return merged;
      });
      showToast(`✓ ${imported.length} registro(s) importado(s)`);
    } catch (err) {
      showToast(`⚠️ ${err.message}`);
    }
    e.target.value = '';   // permite reimportar o mesmo arquivo
  };

  // Telefones sem duplicata, formatados ABNT
  const telefones = data ? getTelefones(data) : [];

  // Encerrada?
  const encerrada = data ? isEncerrada(data.descricao_situacao_cadastral || '') : false;

  // ─────────────────────────────────────────────────────────────────────────
  return (
    <div style={{ maxWidth: 960, margin: '0 auto', padding: '26px 16px 44px' }}>

      {/* Toast */}
      <div className={`toast${toast ? ' show' : ''}`}>{toast}</div>

      {/* Input file oculto para importar JSON */}
      <input
        ref={importRef}
        type="file"
        accept=".json,application/json"
        style={{ display: 'none' }}
        onChange={handleImport}
      />

      {/* Header */}
      <header style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom: 26 }}>
        <div>
          <div className="label" style={{ marginBottom:8 }}>Sistema de Inteligência Empresarial</div>
          <h1 style={{ fontSize:'clamp(1.65rem,4.5vw,2.4rem)', fontWeight:800, letterSpacing:'-0.025em', lineHeight:1.05 }}>

GoADUagANRqAA1AAD3xqAA1GoADUagABqAAGoADUagANRqAA1GoADUagANRqAA1G4ABqE9AAGo1AAN7xqAA1GoADUagANQAB/9k=" alt="Fênix" style={{ height:'52px', width:'52px', borderRadius:'12px', objectFit:'cover', boxShadow:'0 2px 12px rgba(4,18,115,0.4)', verticalAlign:'middle', marginRight:'10px' }} />
            <span>Fênix&nbsp;<span style={{ color:'var(--gold)' }}>CNPJ</span></span>
            <sup style={{ fontSize:'0.35em', color:'var(--muted)', fontWeight:400, marginLeft:8, verticalAlign:'super' }}>v1.5</sup>
          </h1>
          <p style={{ marginTop:7, fontSize:'0.78rem', color:'var(--muted)', maxWidth:360, lineHeight:1.5 }}>
            Consulta empresarial em tempo real · Dados via BrasilAPI
          </p>
        </div>
        {prompt && (
          <button onClick={handleInstall} className="btn-gold install-pulse"
            style={{ fontSize:'0.82rem', padding:'10px 18px', marginTop:4 }}>
            📲 Instalar App
          </button>
        )}
      </header>

      {/* Busca */}
      <div className="glass" style={{ padding:'22px 24px', marginBottom:14 }}>
        <div className="label">Consultar CNPJ</div>
        <div className="search-row" style={{ display:'flex', gap:10 }}>
          <input
            ref={inputRef}
            type="text" inputMode="numeric"
            className={`input-cnpj${inputCls}`}
            placeholder="00.000.000/0000-00"
            value={cnpj}
            onChange={e => { setError(''); setCnpj(maskCnpj(e.target.value)); }}
            onKeyDown={handleKey}
            maxLength={18} autoComplete="off" spellCheck="false"
          />
          <button className="btn-gold" onClick={consultar} disabled={loading}>
            {loading ? <><span className="spinner"></span>Consultando…</> : '🔍 Consultar'}
          </button>
        </div>
        {error && (
          <div className="error-box">
            <span>⚠️</span> {error}
          </div>
        )}
        <div style={{ marginTop:10, fontSize:'0.7rem', color:'var(--muted2)' }}>
          Pressione <kbd style={{ background:'rgba(255,255,255,0.08)', padding:'1px 6px', borderRadius:4, fontFamily:'monospace' }}>Enter</kbd> para consultar
        </div>
      </div>

      {/* Resultado */}
      {data && (
        <div className="fade-up" style={{ marginBottom:14 }}>

          {/* Cabeçalho da empresa */}
          <div className="glass" style={{ padding:'20px 24px', marginBottom:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:14 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="label">Empresa</div>
                <h2 style={{ fontSize:'clamp(1rem,2.8vw,1.4rem)', fontWeight:700, lineHeight:1.25, marginBottom:4 }}>
                  {data.razao_social || '—'}
                </h2>
                {data.nome_fantasia && (
                  <p style={{ color:'var(--muted)', fontSize:'0.875rem', marginBottom:10 }}>
                    {data.nome_fantasia}
                  </p>
                )}
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  <Badge text={data.descricao_situacao_cadastral} />
                  {data.porte            && <span className="badge outro">{data.porte}</span>}
                  {data.opcao_pelo_simples && <span className="badge outro">Simples Nacional</span>}
                  {data.opcao_pelo_mei   && <span className="badge outro">MEI</span>}
                  {encerrada && data.data_situacao_cadastral && (
                    <span className="encerrada-badge">
                      🔒 Enc. {fmtDate(data.data_situacao_cadastral)}
                    </span>
                  )}
                </div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div className="mono" style={{ color:'var(--gold)', fontSize:'1.05rem', fontWeight:600, letterSpacing:'0.02em' }}>
                  {maskCnpj(data.cnpj || '')}
                </div>
                {meta && (
                  <div style={{ fontSize:'0.67rem', color:'var(--muted2)', marginTop:5 }}>
                    {meta.time.toLocaleTimeString('pt-BR')} · {meta.ms} ms
                  </div>
                )}
                <button onClick={limparBusca} className="btn-ghost"
                  style={{ marginTop:8, fontSize:'0.7rem' }}>
                  ✕ Nova busca
                </button>
              </div>
            </div>
          </div>

          {/* Abas + ações */}
          <div className="glass" style={{ padding:6, marginBottom:12, display:'flex', alignItems:'center', gap:4 }}>
            <div className="tabs" style={{ flex:1 }}>
              {[
                { id:'resumo', lbl:'📋 Resumo'  },
                { id:'socios', lbl:'👥 Sócios'  },
                { id:'cnaes',  lbl:'🏭 CNAEs'   },
              ].map(t => (
                <button key={t.id}
                  className={`tab${tab === t.id ? ' active' : ''}`}
                  onClick={() => setTab(t.id)}>
                  {t.lbl}
                </button>
              ))}
            </div>
            <div style={{ display:'flex', gap:5, paddingRight:4, flexShrink:0 }}>
              <button className="btn-ghost gold" onClick={copyJson} title="Copiar dados completos em JSON">
                ⎘ JSON
              </button>
              <button className="btn-ghost gold"
                onClick={() => { downloadJson(data, `cnpj-${(data.cnpj||'').replace(/\D/g,'')}.json`); showToast('✓ JSON exportado'); }}
                title="Baixar arquivo .json">
                ↓ JSON
              </button>
              <button className="btn-ghost green"
                onClick={() => { exportPdf(data, meta); showToast('✓ PDF gerado'); }}
                title="Exportar relatório em PDF">
                ↓ PDF
              </button>
            </div>
          </div>

          {/* Aba: Resumo */}
          {tab === 'resumo' && (
            <div className="fade-up">
              <div className="data-grid">
                <DataCard label="CNPJ"              value={maskCnpj(data.cnpj || '')} mono />
                <DataCard label="Natureza Jurídica" value={data.natureza_juridica} />
                <DataCard label="Data de Abertura"  value={fmtDate(data.data_inicio_atividade)} />
                {encerrada && (
                  <DataCard
                    label="Data de Encerramento"
                    value={fmtDate(data.data_situacao_cadastral)}
                  />
                )}
                <DataCard label="Situação"         value={data.descricao_situacao_cadastral} />
                <DataCard label="Motivo"            value={data.descricao_motivo_situacao_cadastral} />
                <DataCard label="Capital Social"    value={data.capital_social ? fmtCurrencyExtended(data.capital_social) : null} />
                <DataCard label="Logradouro"
                  value={[data.tipo_logradouro, data.logradouro, data.numero, data.complemento]
                    .filter(Boolean).join(' ')} />
                <DataCard label="Bairro"     value={data.bairro} />
                <DataCard label="Município"  value={data.municipio} />
                <DataCard label="UF"         value={data.uf} />
                <DataCard label="CEP"        value={data.cep ? fmtCep(String(data.cep)) : null} mono />
                {telefones.map((t, i) => (
                  <DataCard
                    key={i}
                    label={i === 0 ? 'Telefone' : `Telefone ${i + 1}`}
                    value={t}
                    mono
                  />
                ))}
                <DataCard label="E-mail"     value={data.email} />
                <DataCard label="Simples"    value={data.opcao_pelo_simples != null ? (data.opcao_pelo_simples ? 'Sim' : 'Não') : null} />
                <DataCard label="MEI"        value={data.opcao_pelo_mei    != null ? (data.opcao_pelo_mei    ? 'Sim' : 'Não') : null} />
              </div>
            </div>
          )}

          {/* Aba: Sócios */}
          {tab === 'socios' && (
            <div className="fade-up" style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {data.qsa && data.qsa.length > 0 ? data.qsa.map((s, i) => (
                <div key={i} className="socio-card">
                  <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:'0.975rem' }}>
                        {s.nome_socio || s.nome_representante_legal || '—'}
                      </div>
                      <div style={{ color:'var(--muted)', fontSize:'0.82rem', marginTop:3 }}>
                        {s.qualificacao_socio}
                      </div>
                      {s.nome_representante_legal && s.nome_representante_legal !== s.nome_socio && (
                        <div style={{ color:'var(--muted2)', fontSize:'0.78rem', marginTop:2 }}>
                          Representante: {s.nome_representante_legal}
                        </div>
                      )}
                    </div>
                    <div style={{ textAlign:'right' }}>
                      {s.cnpj_cpf_do_socio && (
                        <div className="mono" style={{ fontSize:'0.8rem', color:'var(--gold)' }}>
                          {s.cnpj_cpf_do_socio}
                        </div>
                      )}
                      {s.data_entrada_sociedade && (
                        <div style={{ fontSize:'0.72rem', color:'var(--muted)', marginTop:3 }}>
                          Sócio desde {fmtDate(s.data_entrada_sociedade)}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )) : (
                <div style={{ textAlign:'center', color:'var(--muted)', padding:'40px 0', fontSize:'0.875rem' }}>
                  Nenhum sócio registrado para este CNPJ.
                </div>
              )}
            </div>
          )}

          {/* Aba: CNAEs */}
          {tab === 'cnaes' && (
            <div className="fade-up" style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {data.cnae_fiscal && (
                <div className="glass-sm" style={{ padding:'16px 20px' }}>
                  <div className="label">CNAE Principal</div>
                  <div className="cnae-row" style={{ padding:'6px 0 0' }}>
                    <span className="mono" style={{ color:'var(--gold)', fontWeight:700, fontSize:'0.9rem' }}>
                      {data.cnae_fiscal}
                    </span>
                    <span style={{ fontSize:'0.9rem', lineHeight:1.5 }}>
                      {data.cnae_fiscal_descricao || '—'}
                    </span>
                  </div>
                </div>
              )}
              {data.cnaes_secundarios && data.cnaes_secundarios.length > 0 && (
                <div className="glass-sm" style={{ padding:'16px 20px' }}>
                  <div className="label">CNAEs Secundários ({data.cnaes_secundarios.length})</div>
                  {data.cnaes_secundarios.map((c, i) => (
                    <div key={i} className="cnae-row">
                      <span className="cnae-code">{c.codigo}</span>
                      <span style={{ fontSize:'0.875rem', lineHeight:1.5 }}>{c.descricao}</span>
                    </div>
                  ))}
                </div>
              )}
              {!data.cnae_fiscal && (!data.cnaes_secundarios || !data.cnaes_secundarios.length) && (
                <div style={{ textAlign:'center', color:'var(--muted)', padding:'40px 0', fontSize:'0.875rem' }}>
                  Nenhuma atividade econômica registrada.
                </div>
              )}
            </div>
          )}

        </div>
      )}

      {/* Histórico */}
      <div className="glass" style={{ padding:'22px 24px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:8 }}>
          <div>
            <div className="label" style={{ marginBottom:4 }}>Histórico de Consultas</div>
            <p style={{ fontSize:'0.74rem', color:'var(--muted)' }}>
              {history.length} registro{history.length !== 1 ? 's' : ''} · salvo em JSON no dispositivo
            </p>
          </div>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {/* Importar backup */}
            <button className="btn-ghost gold"
              onClick={() => importRef.current?.click()}
              title="Importar backup .json">
              ↑ Importar JSON
            </button>
            {history.length > 0 && (
              <>
                <button className="btn-ghost gold"
                  onClick={() => { downloadJson(history, 'fenix-historico.json'); showToast('✓ Histórico exportado como JSON'); }}>
                  ↓ Exportar JSON
                </button>
                <button className="btn-ghost red" onClick={clearHistory}>✕ Limpar</button>
              </>
            )}
          </div>
        </div>

        {history.length > 0 ? (
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {history.map((item, i) => (
              <div key={i} className="hist-item"
                onClick={() => { setCnpj(item.cnpj); setError(''); inputRef.current?.focus(); }}>
                <Badge text={item.situacao} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:'0.875rem', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {item.razao_social || item.cnpj}
                  </div>
                  {item.nome_fantasia && (
                    <div style={{ fontSize:'0.72rem', color:'var(--muted)', marginTop:1 }}>
                      {item.nome_fantasia}
                    </div>
                  )}
                  {/* Chips: abertura / encerramento / capital */}
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4, marginTop:4 }}>
                    {item.data_abertura && (
                      <span className="hist-chip">
                        📅 Abertura {fmtDate(item.data_abertura)}
                      </span>
                    )}
                    {item.data_encerramento && (
                      <span className="hist-chip" style={{ color:'#FCA5A5', borderColor:'rgba(239,68,68,0.25)' }}>
                        🔒 Enc. {fmtDate(item.data_encerramento)}
                      </span>
                    )}
                    {item.capital_social ? (
                      <span className="hist-chip" style={{ color:'var(--gold)', borderColor:'rgba(245,158,11,0.2)' }}>
                        💰 {fmtCurrencyExtended(item.capital_social)}
                      </span>
                    ) : null}
                  </div>
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <div className="mono" style={{ fontSize:'0.75rem', color:'var(--gold)' }}>{item.cnpj}</div>
                  {item.municipio && (
                    <div style={{ fontSize:'0.65rem', color:'var(--muted2)', marginTop:2 }}>
                      {item.municipio}/{item.uf}
                    </div>
                  )}
                  <div style={{ fontSize:'0.62rem', color:'var(--muted2)', marginTop:2 }}>
                    {new Date(item.consultadoEm).toLocaleDateString('pt-BR')}
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ textAlign:'center', padding:'28px 0' }}>
            <div style={{ fontSize:'2rem', marginBottom:8, opacity:0.3 }}>🔍</div>
            <p style={{ fontSize:'0.85rem', color:'var(--muted)' }}>Nenhuma consulta realizada ainda.</p>
            <p style={{ fontSize:'0.74rem', color:'var(--muted2)', marginTop:4 }}>
              O histórico é salvo automaticamente no seu dispositivo.
            </p>
          </div>
        )}
      </div>

      {/* Footer */}
      <footer>
        © 2026&nbsp;
        <a href="https://wa.me/5579999680880" target="_blank" rel="noopener">Cristiano Fênix</a>
        &nbsp;·&nbsp;
        <a href="https://instagram.com/fenixsolucoestecnologicas" target="_blank" rel="noopener">Fênix Soluções Tecnológicas</a>
        &nbsp;·&nbsp;BrasilAPI
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FenixApp />);
</script>
</body>
</html>
