<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fênix | Consulta Empresarial</title>

  <meta name="theme-color" content="#041273">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fênix CNPJ">
  <meta name="description" content="Consulta de CNPJ rápida e profissional — Fênix Soluções Tecnológicas">

  <link rel="manifest" href='data:application/manifest+json,{"name":"F%C3%AAnix%20Consulta%20Empresarial","short_name":"F%C3%AAnix%20CNPJ","start_url":".","display":"standalone","background_color":"%23041273","theme_color":"%23041273","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3163/3163478.png","sizes":"512x512","type":"image/png"}]}'>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Identidade Fênix ── */
      --brand:      #041273;
      --brand-mid:  #071EA8;
      --brand-lite: #0B2ED4;
      --brand-glow: rgba(4,18,115,0.6);

      /* ── Superfícies ── */
      --bg:       #030C50;      /* fundo profundo navy */
      --surface:  rgba(5,20,90,0.75);
      --surface2: rgba(4,15,75,0.85);
      --surface3: rgba(7,22,100,0.5);
      --glass-bg: rgba(8,25,110,0.55);

      /* ── Bordas ── */
      --border:   rgba(100,140,255,0.13);
      --border2:  rgba(100,140,255,0.07);
      --border-hi: rgba(100,140,255,0.22);

      /* ── Cores de destaque ── */
      --gold:      #F59E0B;
      --gold-hi:   #FCD34D;
      --gold-dim:  rgba(245,158,11,0.14);
      --emerald:   #10B981;
      --red:       #EF4444;

      /* ── Texto ── */
      --text:   #D8E4FF;
      --muted:  rgba(180,205,255,0.5);
      --muted2: rgba(180,205,255,0.28);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      /* Gradiente Fênix: azul profundo → brand → teal escuro */
      background:
        linear-gradient(145deg,
          #010820 0%,
          #041273 28%,
          #062094 52%,
          #041F7A 72%,
          #021050 100%);
      background-attachment: fixed;
    }

    /* Efeito de malha luminosa sobre o gradiente */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10%  0%,  rgba(59,130,246,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(16,185,129,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 50%  50%, rgba(245,158,11,0.05) 0%, transparent 70%);
    }

    /* Grade sutil de fundo */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(100,140,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,140,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    #root { position: relative; z-index: 1; }

    /* ── Tipografia ── */
    .mono { font-family: 'JetBrains Mono', monospace; }
    .label {
      font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .label::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(245,158,11,0.3), transparent);
    }

    /* ── Painéis ── */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .glass-sm {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    /* ── Input ── */
    .input-cnpj {
      width: 100%;
      background: rgba(3,10,55,0.7);
      border: 1.5px solid var(--border-hi);
      border-radius: 12px;
      padding: 15px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem; color: var(--text);
      outline: none; letter-spacing: 0.04em;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .input-cnpj:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12), 0 0 20px rgba(245,158,11,0.06);
    }
    .input-cnpj::placeholder { color: var(--muted2); font-size: 1rem; }
    .input-cnpj.valid   { border-color: rgba(16,185,129,0.5); }
    .input-cnpj.invalid { border-color: rgba(239,68,68,0.4); }

    /* ── Botão principal ── */
    .btn-gold {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #020B3A;
      font-weight: 800; font-family: 'Syne', sans-serif;
      border: none; border-radius: 12px;
      padding: 15px 30px;
      cursor: pointer; font-size: 0.9rem; letter-spacing: 0.05em;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
      white-space: nowrap; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(245,158,11,0.25);
    }
    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 6px 24px rgba(245,158,11,0.4);
      transform: translateY(-1px);
    }
    .btn-gold:active:not(:disabled) { transform: scale(0.96); }
    .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Botão fantasma ── */
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 14px; font-size: 0.74rem; font-weight: 600;
      font-family: 'Syne', sans-serif; letter-spacing: 0.05em;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn-ghost:hover  { color: var(--text); border-color: var(--border-hi); }
    .btn-ghost.gold   { color: var(--gold); border-color: rgba(245,158,11,0.3); }
    .btn-ghost.gold:hover { background: var(--gold-dim); }
    .btn-ghost.red    { color: var(--red); border-color: rgba(239,68,68,0.3); }
    .btn-ghost.red:hover  { background: rgba(239,68,68,0.08); }
    .btn-ghost.green  { color: var(--emerald); border-color: rgba(16,185,129,0.3); }

    /* ── Abas (sem JSON) ── */
    .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 5px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: transparent;
      border: 1.5px solid transparent;
      border-radius: 9px; padding: 8px 20px;
      font-size: 0.76rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      cursor: pointer; color: var(--muted);
      font-family: 'Syne', sans-serif;
      transition: all 0.18s; white-space: nowrap;
    }
    .tab.active {
      background: rgba(4,18,115,0.7);
      color: var(--gold);
      border-color: rgba(245,158,11,0.25);
      box-shadow: 0 2px 12px rgba(4,18,115,0.4);
    }
    .tab:not(.active):hover { color: var(--text); background: rgba(255,255,255,0.04); }

    /* ── Badges de situação ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 999px;
      font-size: 0.67rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .ativa   { background: rgba(16,185,129,0.12); color: #10B981; border-color: rgba(16,185,129,0.28); }
    .inativa { background: rgba(239,68,68,0.12);  color: #EF4444; border-color: rgba(239,68,68,0.28); }
    .outro   { background: rgba(245,158,11,0.12); color: #F59E0B; border-color: rgba(245,158,11,0.28); }

    /* ── Cards de dados ── */
    .data-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); }
    .data-card {
      background: rgba(3,10,60,0.6);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .data-card:hover { border-color: var(--border-hi); }
    .data-card-lbl {
      font-size: 0.61rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 5px;
    }
    .data-card-val { font-size: 0.9rem; color: var(--text); font-weight: 500; word-break: break-word; line-height: 1.45; }

    /* ── Toast de cópia ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--emerald); color: #fff;
      padding: 10px 22px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.05em;
      box-shadow: 0 8px 24px rgba(16,185,129,0.35);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      pointer-events: none; z-index: 999; opacity: 0;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Erro ── */
    .error-box {
      margin-top: 12px;
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.22);
      border-radius: 10px; padding: 12px 16px;
      font-size: 0.85rem; color: #FCA5A5;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Histórico ── */
    .hist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(3,10,60,0.5);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .hist-item:hover {
      border-color: rgba(245,158,11,0.25);
      background: rgba(4,18,115,0.5);
    }

    /* ── Sócios ── */
    .socio-card {
      background: rgba(3,10,60,0.55);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(3,11,58,0.3);
      border-top-color: #020B3A;
      animation: spin 0.7s linear infinite;
      display: inline-block; flex-shrink: 0;
    }

    /* ── Animações ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.38s cubic-bezier(0.22,1,0.36,1) forwards; }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.55); }
      50%       { box-shadow: 0 0 0 8px rgba(245,158,11,0); }
    }
    .install-pulse { animation: glow 2.2s ease infinite; }

    /* Linha de separação CNAE */
    .cnae-row {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 10px 0;
    }
    .cnae-row + .cnae-row { border-top: 1px solid var(--border2); }
    .cnae-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem; font-weight: 600;
      color: var(--muted); flex-shrink: 0; padding-top: 1px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,140,255,0.2); border-radius: 99px; }

    /* Footer */
    footer { text-align: center; padding: 22px 0 10px; font-size: 0.72rem; color: var(--muted2); }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 580px) {
      .data-grid { grid-template-columns: 1fr 1fr; }
      .search-row { flex-direction: column; }
      .search-row .btn-gold { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Utilitários ─────────────────────────────────────────────────────────────

const maskCnpj = (v = '') => {
  const d = v.replace(/\D/g, '').slice(0, 14);
  return d
    .replace(/^(\d{2})(\d)/,        '$1.$2')
    .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/\.(\d{3})(\d)/,        '.$1/$2')
    .replace(/(\d{4})(\d)/,          '$1-$2');
};

const fmtCurrency = (v) =>
  Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const fmtCep = (v) =>
  String(v).padStart(8, '0').replace(/^(\d{5})(\d{3})$/, '$1-$2');

const fmtDate = (v) => {
  if (!v) return '—';
  const d = new Date(String(v).includes('T') ? v : v + 'T12:00:00');
  return isNaN(d.getTime()) ? String(v) : d.toLocaleDateString('pt-BR');
};

const statusCls = (s = '') => {
  const u = s.toUpperCase();
  if (u.includes('ATIVA') && !u.includes('INAPT') && !u.includes('INATIVA')) return 'ativa';
  if (['INATIVA','BAIXADA','CANCELADA','NULA','INAPTA'].some(w => u.includes(w))) return 'inativa';
  return 'outro';
};

const downloadJson = (obj, filename) => {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click(); URL.revokeObjectURL(url);
};

// ─── Persistência JSON ────────────────────────────────────────────────────────

const STORAGE_KEY = 'fenix:history:v2';
const loadHistory = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
};
const saveHistory = (list) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
};

// ─── Componentes menores ─────────────────────────────────────────────────────

const DataCard = ({ label, value, mono }) => (
  <div className="data-card">
    <div className="data-card-lbl">{label}</div>
    <div className={`data-card-val${mono ? ' mono' : ''}`}>{value || '—'}</div>
  </div>
);

const Badge = ({ text }) => (
  <span className={`badge ${statusCls(text || '')}`}>
    <span className="badge-dot"></span>
    {text || 'Desconhecido'}
  </span>
);

// ─── Aplicação principal ──────────────────────────────────────────────────────

function FenixApp() {
  const [cnpj,    setCnpj]    = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');
  const [data,    setData]    = useState(null);
  const [tab,     setTab]     = useState('resumo');
  const [history, setHistory] = useState(loadHistory);
  const [prompt,  setPrompt]  = useState(null);
  const [toast,   setToast]   = useState('');
  const [meta,    setMeta]    = useState(null);
  const inputRef    = useRef(null);
  const toastTimer  = useRef(null);

  // ── PWA + Service Worker ─────────────────────────────────────────────────
  useEffect(() => {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); setPrompt(e);
    });
    if ('serviceWorker' in navigator) {
      const sw = `
        const CACHE='fenix-sw-v2';
        self.addEventListener('install',()=>self.skipWaiting());
        self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
        self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('',{status:503}))));
      `;
      const blob = new Blob([sw], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2400);
  };

  const handleInstall = async () => {
    if (!prompt) return;
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === 'accepted') setPrompt(null);
  };

  // ── Validação visual do input ─────────────────────────────────────────────
  const digits    = cnpj.replace(/\D/g, '');
  const inputCls  = digits.length === 0 ? '' : digits.length === 14 ? ' valid' : ' invalid';

  // ── Consulta ──────────────────────────────────────────────────────────────
  const consultar = useCallback(async () => {
    const clean = cnpj.replace(/\D/g, '');
    if (clean.length !== 14) {
      setError('CNPJ inválido — informe todos os 14 dígitos.');
      return;
    }
    try {
      setLoading(true); setError(''); setData(null);
      const t0  = performance.now();
      const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || `Empresa não encontrada (${res.status})`);
      }
      const result  = await res.json();
      const elapsed = Math.round(performance.now() - t0);
      setData(result);
      setTab('resumo');
      setMeta({ time: new Date(), ms: elapsed });

      // Registro JSON para o histórico
      const entry = {
        cnpj:           maskCnpj(clean),
        razao_social:   result.razao_social              || '',
        nome_fantasia:  result.nome_fantasia             || '',
        situacao:       result.descricao_situacao_cadastral || '',
        cnae_principal: result.cnae_fiscal_descricao     || '',
        municipio:      result.municipio                 || '',
        uf:             result.uf                        || '',
        capital_social: result.capital_social            || null,
        consultadoEm:   new Date().toISOString(),
      };
      setHistory(prev => {
        const next = [entry, ...prev.filter(h => h.cnpj !== entry.cnpj)].slice(0, 15);
        saveHistory(next); return next;
      });
    } catch (e) {
      setError(e.message || 'Erro na consulta. Verifique o CNPJ e tente novamente.');
    } finally {
      setLoading(false);
    }
  }, [cnpj]);

  const handleKey  = (e) => { if (e.key === 'Enter') consultar(); };
  const limparBusca = () => { setData(null); setError(''); setCnpj(''); inputRef.current?.focus(); };
  const copyJson   = () => {
    if (!data) return;
    navigator.clipboard.writeText(JSON.stringify(data, null, 2))
      .then(() => showToast('✓ JSON copiado para a área de transferência'));
  };
  const clearHistory = () => { setHistory([]); saveHistory([]); };

  // ─────────────────────────────────────────────────────────────────────────
  return (
    <div style={{ maxWidth: 960, margin: '0 auto', padding: '26px 16px 44px' }}>

      {/* ── Toast ── */}
      <div className={`toast${toast ? ' show' : ''}`}>{toast}</div>

      {/* ── Header ── */}
      <header style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom: 26 }}>
        <div>
          <div className="label" style={{ marginBottom:8 }}>Sistema de Inteligência Empresarial</div>
          <h1 style={{ fontSize:'clamp(1.65rem,4.5vw,2.4rem)', fontWeight:800, letterSpacing:'-0.025em', lineHeight:1.05 }}>
            🔥 Fênix&nbsp;<span style={{ color:'var(--gold)' }}>CNPJ</span>
            <sup style={{ fontSize:'0.35em', color:'var(--muted)', fontWeight:400, marginLeft:8, verticalAlign:'super' }}>v2.0</sup>
          </h1>
          <p style={{ marginTop:7, fontSize:'0.78rem', color:'var(--muted)', maxWidth:360, lineHeight:1.5 }}>
            Consulta empresarial em tempo real · Dados via BrasilAPI
          </p>
        </div>
        {prompt && (
          <button onClick={handleInstall} className="btn-gold install-pulse"
            style={{ fontSize:'0.82rem', padding:'10px 18px', marginTop:4 }}>
            📲 Instalar App
          </button>
        )}
      </header>

      {/* ── Busca ── */}
      <div className="glass" style={{ padding:'22px 24px', marginBottom:14 }}>
        <div className="label">Consultar CNPJ</div>
        <div className="search-row" style={{ display:'flex', gap:10 }}>
          <input
            ref={inputRef}
            type="text" inputMode="numeric"
            className={`input-cnpj${inputCls}`}
            placeholder="00.000.000/0000-00"
            value={cnpj}
            onChange={e => { setError(''); setCnpj(maskCnpj(e.target.value)); }}
            onKeyDown={handleKey}
            maxLength={18} autoComplete="off" spellCheck="false"
          />
          <button className="btn-gold" onClick={consultar} disabled={loading}>
            {loading ? <><span className="spinner"></span>Consultando…</> : '🔍 Consultar'}
          </button>
        </div>
        {error && (
          <div className="error-box">
            <span>⚠️</span> {error}
          </div>
        )}
        <div style={{ marginTop:10, fontSize:'0.7rem', color:'var(--muted2)' }}>
          Pressione <kbd style={{ background:'rgba(255,255,255,0.08)', padding:'1px 6px', borderRadius:4, fontFamily:'monospace' }}>Enter</kbd> para consultar
        </div>
      </div>

      {/* ── Resultado ── */}
      {data && (
        <div className="fade-up" style={{ marginBottom:14 }}>

          {/* Cabeçalho da empresa */}
          <div className="glass" style={{ padding:'20px 24px', marginBottom:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:14 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="label">Empresa</div>
                <h2 style={{ fontSize:'clamp(1rem,2.8vw,1.4rem)', fontWeight:700, lineHeight:1.25, marginBottom:4 }}>
                  {data.razao_social || '—'}
                </h2>
                {data.nome_fantasia && (
                  <p style={{ color:'var(--muted)', fontSize:'0.875rem', marginBottom:10 }}>
                    {data.nome_fantasia}
                  </p>
                )}
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  <Badge text={data.descricao_situacao_cadastral} />
                  {data.porte          && <span className="badge outro">{data.porte}</span>}
                  {data.opcao_pelo_simples && <span className="badge outro">Simples Nacional</span>}
                  {data.opcao_pelo_mei && <span className="badge outro">MEI</span>}
                </div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div className="mono" style={{ color:'var(--gold)', fontSize:'1.05rem', fontWeight:600, letterSpacing:'0.02em' }}>
                  {maskCnpj(data.cnpj || '')}
                </div>
                {meta && (
                  <div style={{ fontSize:'0.67rem', color:'var(--muted2)', marginTop:5 }}>
                    {meta.time.toLocaleTimeString('pt-BR')} · {meta.ms} ms
                  </div>
                )}
                <button onClick={limparBusca} className="btn-ghost"
                  style={{ marginTop:8, fontSize:'0.7rem' }}>
                  ✕ Nova busca
                </button>
              </div>
            </div>
          </div>

          {/* Abas — JSON removido: dado técnico, não pertence à UI do usuário */}
          <div className="glass" style={{ padding:6, marginBottom:12, display:'flex', alignItems:'center', gap:4 }}>
            <div className="tabs" style={{ flex:1 }}>
              {[
                { id:'resumo', lbl:'📋 Resumo'  },
                { id:'socios', lbl:'👥 Sócios'  },
                { id:'cnaes',  lbl:'🏭 CNAEs'   },
              ].map(t => (
                <button key={t.id}
                  className={`tab${tab === t.id ? ' active' : ''}`}
                  onClick={() => setTab(t.id)}>
                  {t.lbl}
                </button>
              ))}
            </div>
            {/* Ações técnicas: discretas, ao lado das abas */}
            <div style={{ display:'flex', gap:5, paddingRight:4, flexShrink:0 }}>
              <button className="btn-ghost gold" onClick={copyJson} title="Copiar dados completos em JSON">
                ⎘ JSON
              </button>
              <button className="btn-ghost gold"
                onClick={() => downloadJson(data, `cnpj-${(data.cnpj||'').replace(/\D/g,'')}.json`)}
                title="Baixar arquivo .json">
                ↓ Export
              </button>
            </div>
          </div>

          {/* ── Aba: Resumo ── */}
          {tab === 'resumo' && (
            <div className="fade-up">
              <div className="data-grid">
                <DataCard label="CNPJ"              value={maskCnpj(data.cnpj || '')} mono />
                <DataCard label="Natureza Jurídica" value={data.natureza_juridica} />
                <DataCard label="Data de Abertura"  value={fmtDate(data.data_inicio_atividade)} />
                <DataCard label="Situação"          value={data.descricao_situacao_cadastral} />
                <DataCard label="Motivo"            value={data.descricao_motivo_situacao_cadastral} />
                <DataCard label="Capital Social"    value={data.capital_social ? fmtCurrency(data.capital_social) : null} />
                <DataCard label="Logradouro"
                  value={[data.tipo_logradouro, data.logradouro, data.numero, data.complemento]
                    .filter(Boolean).join(' ')} />
                <DataCard label="Bairro"     value={data.bairro} />
                <DataCard label="Município"  value={data.municipio} />
                <DataCard label="UF"         value={data.uf} />
                <DataCard label="CEP"        value={data.cep ? fmtCep(String(data.cep)) : null} mono />
                <DataCard label="Telefone"   value={data.ddd_telefone_1 || null} />
                {data.ddd_telefone_2 &&
                  <DataCard label="Telefone 2" value={data.ddd_telefone_2} />}
                <DataCard label="E-mail"     value={data.email} />
                <DataCard label="Simples"    value={data.opcao_pelo_simples != null ? (data.opcao_pelo_simples ? 'Sim' : 'Não') : null} />
                <DataCard label="MEI"        value={data.opcao_pelo_mei    != null ? (data.opcao_pelo_mei    ? 'Sim' : 'Não') : null} />
              </div>
            </div>
          )}

          {/* ── Aba: Sócios ── */}
          {tab === 'socios' && (
            <div className="fade-up" style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {data.qsa && data.qsa.length > 0 ? data.qsa.map((s, i) => (
                <div key={i} className="socio-card">
                  <div style={{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:'0.975rem' }}>
                        {s.nome_socio || s.nome_representante_legal || '—'}
                      </div>
                      <div style={{ color:'var(--muted)', fontSize:'0.82rem', marginTop:3 }}>
                        {s.qualificacao_socio}
                      </div>
                      {s.nome_representante_legal && s.nome_representante_legal !== s.nome_socio && (
                        <div style={{ color:'var(--muted2)', fontSize:'0.78rem', marginTop:2 }}>
                          Representante: {s.nome_representante_legal}
                        </div>
                      )}
                    </div>
                    <div style={{ textAlign:'right' }}>
                      {s.cnpj_cpf_do_socio && (
                        <div className="mono" style={{ fontSize:'0.8rem', color:'var(--gold)' }}>
                          {s.cnpj_cpf_do_socio}
                        </div>
                      )}
                      {s.data_entrada_sociedade && (
                        <div style={{ fontSize:'0.72rem', color:'var(--muted)', marginTop:3 }}>
                          Sócio desde {fmtDate(s.data_entrada_sociedade)}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )) : (
                <div style={{ textAlign:'center', color:'var(--muted)', padding:'40px 0', fontSize:'0.875rem' }}>
                  Nenhum sócio registrado para este CNPJ.
                </div>
              )}
            </div>
          )}

          {/* ── Aba: CNAEs ── */}
          {tab === 'cnaes' && (
            <div className="fade-up" style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {data.cnae_fiscal && (
                <div className="glass-sm" style={{ padding:'16px 20px' }}>
                  <div className="label">CNAE Principal</div>
                  <div className="cnae-row" style={{ padding:'6px 0 0' }}>
                    <span className="mono" style={{ color:'var(--gold)', fontWeight:700, fontSize:'0.9rem' }}>
                      {data.cnae_fiscal}
                    </span>
                    <span style={{ fontSize:'0.9rem', lineHeight:1.5 }}>
                      {data.cnae_fiscal_descricao || '—'}
                    </span>
                  </div>
                </div>
              )}
              {data.cnaes_secundarios && data.cnaes_secundarios.length > 0 && (
                <div className="glass-sm" style={{ padding:'16px 20px' }}>
                  <div className="label">CNAEs Secundários ({data.cnaes_secundarios.length})</div>
                  {data.cnaes_secundarios.map((c, i) => (
                    <div key={i} className="cnae-row">
                      <span className="cnae-code">{c.codigo}</span>
                      <span style={{ fontSize:'0.875rem', lineHeight:1.5 }}>{c.descricao}</span>
                    </div>
                  ))}
                </div>
              )}
              {!data.cnae_fiscal && (!data.cnaes_secundarios || !data.cnaes_secundarios.length) && (
                <div style={{ textAlign:'center', color:'var(--muted)', padding:'40px 0', fontSize:'0.875rem' }}>
                  Nenhuma atividade econômica registrada.
                </div>
              )}
            </div>
          )}

        </div>
      )}

      {/* ── Histórico ── */}
      <div className="glass" style={{ padding:'22px 24px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div>
            <div className="label" style={{ marginBottom:4 }}>Histórico de Consultas</div>
            <p style={{ fontSize:'0.74rem', color:'var(--muted)' }}>
              {history.length} registro{history.length !== 1 ? 's' : ''} · salvo em JSON no dispositivo
            </p>
          </div>
          {history.length > 0 && (
            <div style={{ display:'flex', gap:6 }}>
              <button className="btn-ghost gold"
                onClick={() => { downloadJson(history, 'fenix-historico.json'); showToast('✓ Histórico exportado como JSON'); }}>
                ↓ Exportar JSON
              </button>
              <button className="btn-ghost red" onClick={clearHistory}>✕ Limpar</button>
            </div>
          )}
        </div>

        {history.length > 0 ? (
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {history.map((item, i) => (
              <div key={i} className="hist-item"
                onClick={() => { setCnpj(item.cnpj); setError(''); inputRef.current?.focus(); }}>
                <Badge text={item.situacao} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:'0.875rem', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {item.razao_social || item.cnpj}
                  </div>
                  {item.nome_fantasia && (
                    <div style={{ fontSize:'0.72rem', color:'var(--muted)', marginTop:1 }}>
                      {item.nome_fantasia}
                    </div>
                  )}
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <div className="mono" style={{ fontSize:'0.75rem', color:'var(--gold)' }}>{item.cnpj}</div>
                  {item.municipio && (
                    <div style={{ fontSize:'0.65rem', color:'var(--muted2)', marginTop:2 }}>
                      {item.municipio}/{item.uf}
                    </div>
                  )}
                  <div style={{ fontSize:'0.62rem', color:'var(--muted2)', marginTop:2 }}>
                    {new Date(item.consultadoEm).toLocaleDateString('pt-BR')}
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ textAlign:'center', padding:'28px 0' }}>
            <div style={{ fontSize:'2rem', marginBottom:8, opacity:0.3 }}>🔍</div>
            <p style={{ fontSize:'0.85rem', color:'var(--muted)' }}>Nenhuma consulta realizada ainda.</p>
            <p style={{ fontSize:'0.74rem', color:'var(--muted2)', marginTop:4 }}>
              O histórico é salvo automaticamente no seu dispositivo.
            </p>
          </div>
        )}
      </div>

      {/* ── Footer ── */}
      <footer>
        © 2026&nbsp;
        <a href="https://wa.me/5579999680880" target="_blank" rel="noopener">Cristiano Fênix</a>
        &nbsp;·&nbsp;
        <a href="https://instagram.com/fenixsolucoestecnologicas" target="_blank" rel="noopener">Fênix Soluções Tecnológicas</a>
        &nbsp;·&nbsp;BrasilAPI
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FenixApp />);
</script>
</body>
</html>
