<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fênix | Consulta Empresarial v1.0</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="manifest" href='data:application/manifest+json,{"name":"Fênix Consulta Empresarial","short_name":"Fênix","start_url":".","display":"standalone","background_color":"#041273","theme_color":"#041273","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3135/3135715.png","sizes":"512x512","type":"image/png"}]}' />
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function FenixConsultaEmpresarialV10() {
      const [cnpj, setCnpj] = useState('')
      const [loading, setLoading] = useState(false)
      const [error, setError] = useState('')
      const [data, setData] = useState(null)
      const [history, setHistory] = useState([])
      const [showJson, setShowJson] = useState(false)
      const [deferredPrompt, setDeferredPrompt] = useState(null)

      // Captura o evento de instalação do PWA
      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
        
        const saved = localStorage.getItem('fenix-cnpj-history')
        if (saved) setHistory(JSON.parse(saved))
      }, [])

      const handleInstall = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') setDeferredPrompt(null);
        }
      }

      const maskCnpj = (value) => {
        const digits = value.replace(/\D/g, '').slice(0, 14)
        return digits
          .replace(/^(\d{2})(\d)/, '$1.$2')
          .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
          .replace(/\.(\d{3})(\d)/, '.$1/$2')
          .replace(/(\d{4})(\d)/, '$1-$2')
      }

      const formatValue = (key, value) => {
        if (value === null || value === undefined || value === '') return '—'
        if (typeof value === 'boolean') return value ? 'Sim' : 'Não'

        const keyLower = key.toLowerCase()
        if (keyLower.includes('capital')) {
          return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
        }
        if (keyLower.includes('cep')) {
          return String(value).replace(/(\d{5})(\d{3})/, '$1-$2')
        }
        if (keyLower.includes('cnpj')) return maskCnpj(String(value))
        return String(value)
      }

      const countFields = (obj) => {
        if (!obj || typeof obj !== 'object') return 0
        let total = 0
        Object.values(obj).forEach((v) => {
          if (Array.isArray(v)) total += v.length
          else if (v && typeof v === 'object') total += countFields(v)
          else if (v !== '' && v !== null) total++
        })
        return total
      }

      const renderJson = (value, path = 'root') => {
        if (Array.isArray(value)) {
          return (
            <div className="space-y-2">
              {value.map((item, i) => (
                <div key={`${path}-${i}`} className="border border-white/10 rounded-2xl p-3 bg-white/5">
                  <div className="text-xs text-white/50 mb-2">Item {i + 1}</div>
                  {renderJson(item, `${path}-${i}`)}
                </div>
              ))}
            </div>
          )
        }

        if (value && typeof value === 'object') {
          return (
            <div className="grid gap-3">
              {Object.entries(value).map(([k, v]) => (
                <div key={`${path}-${k}`} className="rounded-2xl bg-white/5 border border-white/10 p-4">
                  <div className="text-sm text-green-300 mb-2">{k}</div>
                  {typeof v === 'object'
                    ? renderJson(v, `${path}-${k}`)
                    : <div className="text-white/90">{formatValue(k, v)}</div>}
                </div>
              ))}
            </div>
          )
        }

        return <div>{String(value)}</div>
      }

      const consultar = async () => {
        const clean = cnpj.replace(/\D/g, '')
        if (clean.length !== 14) {
          setError('CNPJ inválido.')
          return
        }

        try {
          setLoading(true)
          setError('')

          const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`)
          if (!response.ok) throw new Error('Empresa não encontrada.')

          const result = await response.json()
          setData(result)

          const updated = [maskCnpj(clean), ...history.filter(x => x !== maskCnpj(clean))].slice(0, 5)
          setHistory(updated)
          localStorage.setItem('fenix-cnpj-history', JSON.stringify(updated))
        } catch (e) {
          setError(e.message || 'Erro ao consultar API.')
        } finally {
          setLoading(false)
        }
      }

      const stats = useMemo(() => ({
        fields: countFields(data),
        last: data ? new Date().toLocaleTimeString('pt-BR') : '--:--'
      }), [data])

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#041273] to-green-700 text-white p-6">
          <div className="max-w-7xl mx-auto space-y-6">
            
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <h1 className="text-4xl font-bold">Fênix | Consulta Empresarial v1.0</h1>
              {deferredPrompt && (
                <button onClick={handleInstall} className="rounded-2xl px-4 py-2 bg-yellow-400 text-slate-900 font-bold text-sm animate-pulse">
                  📲 Instalar Aplicativo
                </button>
              )}
            </div>

            <div className="bg-white/10 rounded-3xl p-6 border border-white/10">
              <label className="block mb-2">🧾 CNPJ</label>
              <div className="flex gap-3 flex-col md:flex-row">
                <input value={cnpj} onChange={(e)=>setCnpj(maskCnpj(e.target.value))} placeholder="00.000.000/0000-00" className="flex-1 rounded-2xl px-4 py-4 bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none" />
                <button onClick={consultar} disabled={loading} className="rounded-2xl px-6 py-4 bg-gradient-to-r from-green-400 to-emerald-500 text-slate-900 font-bold transition-all active:scale-95 disabled:opacity-50">
                  {loading ? '⏳ Consultando...' : '🔍 Consultar'}
                </button>
              </div>
              {error && <div className="mt-4 bg-red-500/10 border border-red-400/20 p-4 rounded-2xl">⚠️ {error}</div>}
            </div>

            {data && <>
              <div className="grid lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-white/10 rounded-3xl p-6 border border-white/10">
                  <h2 className="text-2xl font-bold mb-4">🏢 Resumo Empresarial</h2>
                  <div className="grid md:grid-cols-2 gap-4">
                    {[
                      ['🏢','Razão Social',data.razao_social],
                      ['🏬','Fantasia',data.nome_fantasia],
                      ['🟢','Situação',data.descricao_situacao_cadastral],
                      ['📍','Endereço',`${data.logradouro || ''}, ${data.numero || ''}`],
                      ['🌎','Cidade/UF',`${data.municipio || ''}/${data.uf || ''}`],
                      ['💼','CNAE',data.cnae_fiscal_descricao],
                      ['📞','Telefone',data.ddd_telefone_1],
                      ['✉️','E-mail',data.email],
                      ['🧾','IE',data.inscricoes_estaduais?.length || 0]
                    ].map(([icon,label,val])=>(
                      <div key={label} className="bg-white/5 rounded-2xl p-4 border border-white/10">
                        <div className="text-white/60 text-sm">{icon} {label}</div>
                        <div className="font-medium break-words">{val || '—'}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white/10 rounded-3xl p-6 border border-white/10 space-y-4 h-fit">
                  <div>📌 Campos preenchidos: {stats.fields}</div>
                  <div>🕒 Última consulta: {stats.last}</div>
                  <button onClick={()=>setShowJson(!showJson)} className="w-full rounded-2xl py-3 bg-white/10 border border-white/20 hover:bg-white/20 transition-all">👁️ {showJson ? 'Esconder' : 'Ver'} JSON</button>
                  <button onClick={()=>navigator.clipboard.writeText(JSON.stringify(data,null,2))} className="w-full rounded-2xl py-3 bg-white/10 border border-white/20 hover:bg-white/20 transition-all">📋 Copiar JSON</button>
                </div>
              </div>

              {showJson && <div className="bg-black/30 rounded-3xl p-6 border border-white/10 overflow-auto max-h-96 text-xs font-mono"><pre>{JSON.stringify(data,null,2)}</pre></div>}

              <div className="bg-white/10 rounded-3xl p-6 border border-white/10">
                <h2 className="text-2xl font-bold mb-4">🧠 JSON Dinâmico Universal</h2>
                {renderJson(data)}
              </div>
            </>}

            <div className="bg-white/10 rounded-3xl p-6 border border-white/10">
              <h2 className="font-bold text-xl mb-4"> Bars 🕘 Últimas consultas</h2>
              <div className="flex flex-wrap gap-2">
                {history.length ? history.map(item => (
                  <span key={item} className="bg-white/5 border border-white/10 px-3 py-1 rounded-xl text-sm font-mono cursor-pointer hover:bg-white/10" onClick={()=>setCnpj(item)}>
                    {item}
                  </span>
                )) : <span className="text-white/50 text-sm">Nenhuma consulta ainda.</span>}
              </div>
            </div>

            <footer className="text-center text-sm text-white/70 py-4">
              (2026) <a href="https://wa.me/5579999680880" target="_blank" className="underline hover:text-green-300">Cristiano Fênix</a> | (C) <a href="https://instagram.com/fenixsolucoestecnologicas" target="_blank" className="underline hover:text-green-300">Fênix Soluções Tecnológicas</a>
            </footer>
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FenixConsultaEmpresarialV10 />);
  </script>
</body>
</html>
